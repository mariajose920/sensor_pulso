# Configuración de la CLI de Supabase y de la integración con GitHub.
project_id = "ozzehtpqxpicfqvmulcg"

[db]
major_version = 17

[auth]
# Solo correos institucionales (RF96): la validación fuerte está en el trigger de auth.users.
enable_signup = true
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
